<gem-demis-max-height-content-container
  [elementSelectorsToSubtract]="['app-navbar']"
  class="disease-form-root">
  @if (isLoading()){
    <div class="loading-indicator">
      <mat-spinner></mat-spinner>
    </div>
  }
  @else {
    <form id="disease-form" [formGroup]="form" appCheckLabelLength>
    <formly-form [model]="model" [fields]="fields" [form]="form" [options]="formOptions"></formly-form>
    <div id="disease-form-action-bar-wrapper" class="action-bar-wrapper">
      <div class="action-bar">
        <div class="back-button-container">
          <button mat-button id="back-button" class="btn navigate--color back" [disabled]="!canGoBack()" type="button"
                  (click)="goBack()">
            <mat-icon fontIcon="arrow_back_ios"></mat-icon>
            <span>Zurück</span>
          </button>
        </div>
        <div class="button-group">
          @if (canGoForward()) {
            <button mat-button id="forward-button" class="btn navigate--color style forward"
                    type="button"
                    (click)="goForward()">
              <span>Weiter</span>
              <mat-icon iconPositionEnd fontIcon="arrow_forward_ios"></mat-icon>
            </button>
          }
          <button mat-button id="send-button" class="btn style dark--color" [disabled]="!form.valid" type="submit" (click)="submitForm()">
            <span>Abschicken</span>
            <mat-icon class="btn__icon margin--left rotate" iconPositionEnd fontIcon="send"></mat-icon>
          </button>
        </div>
      </div>
    </div>
  </form>

  }
</gem-demis-max-height-content-container>
